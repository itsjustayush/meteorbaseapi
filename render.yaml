services:
  - type: web
    name: meteorbase
    runtime: python
    buildCommand: pip install fastapi==0.116.1 uvicorn==0.35.0 supabase==2.31.0 python-dotenv==1.2.2
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: INTERNAL_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://tinyapi-urjr.onrender.com
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: PROXY_TIMEOUT_SECONDS
        value: "15"
      - key: MAX_REQUEST_BYTES
        value: "2097152"
